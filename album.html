<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Album</title>

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:#111;
    color:white;
}

h1{
    text-align:center;
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:15px;
    padding:15px;
}

.grid img{
    width:100%;
    border-radius:8px;
    cursor:pointer;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.9);
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.main-img{
    max-width:90%;
    max-height:70vh;
    border-radius:10px;
}

.close{
    position:absolute;
    top:10px;
    right:15px;
    font-size:30px;
    cursor:pointer;
    user-select:none;
    z-index:2;
}

.close:hover{
    opacity:0.75;
}

.thumb-bar{
    display:flex;
    gap:8px;
    margin-top:15px;
    overflow-x:auto;
    max-width:90%;
}

.thumb-bar img{
    width:70px;
    height:70px;
    object-fit:cover;
    border-radius:6px;
    opacity:0.5;
    cursor:pointer;
}

.thumb-bar img.active{
    opacity:1;
    outline:2px solid white;
}

.btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    font-size:30px;
    cursor:pointer;
    user-select:none;
    padding:12px 16px;
    z-index:2;
    line-height:1;
}

.btn:hover{
    opacity:0.75;
}

.prev{ left:10px; }
.next{ right:10px; }

@media (min-width: 900px){
    .prev{ left:24px; }
    .next{ right:24px; }
}
</style>
</head>

<body>

<!-- 顶部导航 -->
<div style="
  position: fixed;
  top: 10px;
  left: 10px;
  display: flex;
  gap: 10px;
  z-index: 999;
">
  <a href="index.html"
     style="
       background:rgba(0,0,0,0.5);
       padding:6px 10px;
       border-radius:6px;
       color:white;
       text-decoration:none;
     ">
     ← 首页
  </a>
</div>

<!-- 标题 -->
  <h1 id="title"></h1>

<!-- 相册封面 -->
<div class="grid" id="grid"></div>

<!-- 图片弹窗 -->
<div class="modal" id="modal">

    <div class="close" onclick="closeModal()">✕</div>

    <div class="btn prev" onclick="changeImg(-1)">❮</div>

    <img class="main-img" id="mainImg">

    <a id="downloadBtn"
       href="#"
       style="
         position:absolute;
         bottom:20px;
         right:20px;
         background:rgba(0,0,0,0.6);
         color:white;
         padding:6px 10px;
         border-radius:6px;
         text-decoration:none;
       ">
       ⬇ 下载
    </a>

    <div class="btn next" onclick="changeImg(1)">❯</div>

    <div class="thumb-bar" id="thumbBar"></div>

</div>

<script src="data.js"></script>

<script>

const params = new URLSearchParams(location.search);
const workName = params.get("work");
const work = works[workName];

if(!work){
    document.body.innerHTML="<h1>作品不存在</h1>";
    throw new Error("作品不存在");
}

document.getElementById("title").textContent = work.title;

const albums = work.albums;

const grid = document.getElementById("grid");
const modal = document.getElementById("modal");
const mainImg = document.getElementById("mainImg");
const thumbBar = document.getElementById("thumbBar");
const downloadBtn = document.getElementById("downloadBtn");

let albumIndex = 0;
let imageIndex = 0;


/* =========================
   初始化相册封面
========================= */

albums.forEach((album,i)=>{

    const img = document.createElement("img");

    img.src = album.images[0];

    /* 懒加载 */
    img.loading = "lazy";
    img.decoding = "async";

    img.onclick = ()=>openAlbum(i);

    grid.appendChild(img);

});


/* =========================
   打开相册
========================= */

function openAlbum(i){

    albumIndex = i;
    imageIndex = 0;

    modal.style.display = "flex";

    document.body.style.overflow = "hidden";

    update();
}


/* =========================
   更新当前图片
========================= */

function update(){

    const album = albums[albumIndex];

    /* 当前图片 */
    mainImg.src = album.images[imageIndex];


    /* =========================
       预加载下一张图片
    ========================= */

    const nextIndex =
        (imageIndex + 1) % album.images.length;

    const nextImg = new Image();

    nextImg.src = album.images[nextIndex];


    /* =========================
       下载按钮
    ========================= */

    downloadBtn.onclick = (event) => {

        event.preventDefault();

        const url = album.images[imageIndex];

        const a = document.createElement("a");

        a.href = url;

        a.download = url.split("/").pop();

        a.click();
    };


    /* =========================
       缩略图
    ========================= */
  thumbBar.innerHTML = "";

    album.images.forEach((src,i)=>{

        const img = document.createElement("img");

        img.src = src;

        img.loading = "lazy";
        img.decoding = "async";

        if(i === imageIndex){
            img.classList.add("active");
        }

        img.onclick = () => {

            imageIndex = i;

            update();

        };

        thumbBar.appendChild(img);

    });

}


/* =========================
   切换图片
========================= */

function changeImg(step){

    const album = albums[albumIndex];

    imageIndex =
        (imageIndex + step + album.images.length)
        % album.images.length;

    update();
}


/* =========================
   关闭图片弹窗
========================= */

function closeModal(){

    modal.style.display = "none";

    document.body.style.overflow = "";

}


/* =========================
   电脑端键盘操作
========================= */

document.addEventListener("keydown", (event) => {

    if(modal.style.display !== "flex") return;

    if(event.key === "Escape"){

        closeModal();

    }else if(event.key === "ArrowLeft"){

        changeImg(-1);

    }else if(event.key === "ArrowRight"){

        changeImg(1);

    }

});


/* =========================
   点击弹窗空白处关闭
========================= */

modal.addEventListener("click", (event) => {

    if(event.target === modal){

        closeModal();

    }

});


/* =====================================================
   返回键处理
=====================================================

   目标：

   首页
     ↓
   作品页
     ↓
   看任意数量的相册 / 图片
     ↓
   按返回
     ↓
   直接回首页

   不让打开相册、切换图片产生新的历史记录。

===================================================== */


/*
   给当前作品页建立一个标记。

   注意：
   使用 replaceState 而不是 pushState，
   不会额外增加历史记录。
*/

history.replaceState(
    { albumPage: true },
    "",
    location.href
);


/*
   当用户按手机系统返回键、
   浏览器后退按钮时：

   直接使用 location.replace() 回到首页。

   replace 不会把当前作品页重新塞进历史记录，
   因此不会出现：

   首页 → 作品页 → 首页 → 作品页

   这种来回循环。
*/

window.addEventListener("popstate", () => {

    location.replace("index.html");

});


</script>

</body>
</html>
